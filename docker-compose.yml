# Round 2 with Postgres (spec section 30). Data survives restarts in the
# `pgdata` volume. Put JWT_SECRET and ADMIN_PASSWORD in a `.env` file next to
# this one (see .env.example) - compose refuses to start without them.
#
#   docker compose up -d --build     ->  http://localhost:8000  and  https://<LAN_IP>:8443
#   docker compose ps                ->  api should say "(healthy)"
#   docker compose logs -f api       ->  live server log
#   docker compose down              ->  stop (keeps the data; add -v to WIPE it)
#
# Shows up in Docker Desktop as "borderland-round2". Round 1's old stack also
# uses port 8000: run one at a time, or set ROUND2_PORT in .env.
#
# Phone cameras and GPS only work on https://. The `https` service below puts
# a self-signed HTTPS front on port 8443 (phones accept its warning once). Set
# LAN_IP in .env to this computer's Wi-Fi address so the certificate names it.
# For the real event a proper certificate (Caddy / nginx, or a cloudflared
# tunnel to port 8000) avoids the warning altogether.
name: borderland-round2

services:
  api:
    build: .
    ports:
      - "${ROUND2_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg2://round2:${POSTGRES_PASSWORD:-round2}@postgres:5432/round2
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; /api/v1/health also checks the database.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  https:
    # HTTPS for phones: the same server as `api`, behind a self-signed certificate.
    build: .
    command: ["python", "dev_https.py", "--proxy", "--app-host", "api", "--app-port", "8000", "--port", "8443"]
    environment:
      LAN_IP: ${LAN_IP:-}
    ports:
      - "${ROUND2_HTTPS_PORT:-8443}:8443"
    volumes:
      - devcert:/app/backend/data/dev-cert   # the certificate survives restarts, so phones accept it once
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: round2
      POSTGRES_USER: round2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-round2}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U round2 -d round2"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  devcert:
