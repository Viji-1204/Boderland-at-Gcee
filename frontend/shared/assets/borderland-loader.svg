<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <style>
    @keyframes p {
      0%, 20% { opacity: 1; transform: scale(1.15); }
      25%, 95% { opacity: 0.28; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.15); }
    }
    .s {
      transform-box: fill-box;
      transform-origin: center;
      animation: p 3.2s infinite ease;
    }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 0.8s; }
    .s3 { animation-delay: 1.6s; }
    .s4 { animation-delay: 2.4s; }
  </style>

  <!-- Stage center cross -->
  <g stroke="#111111" stroke-width="1.5">
    <line x1="31.5" y1="31.5" x2="118.5" y2="118.5" />
    <line x1="118.5" y1="31.5" x2="31.5" y2="118.5" />
  </g>

  <!-- Club (Top) -->
  <g class="s s1">
    <path fill="#111111" transform="translate(54, 4) scale(1.75)" d="M12 2a3.2 3.2 0 0 0-3.2 3.2c0 .5.1 1 .3 1.4A3.4 3.4 0 1 0 8.6 13c.9 0 1.7-.3 2.4-.9-.5 2.7-1.6 4.6-3.2 6.1a.6.6 0 0 0 .4 1h8a.6.6 0 0 0 .4-1c-1.6-1.5-2.7-3.4-3.2-6.1.7.6 1.5.9 2.4.9A3.4 3.4 0 1 0 14.9 6.6c.2-.4.3-.9.3-1.4A3.2 3.2 0 0 0 12 2z" />
  </g>

  <!-- Heart (Right) -->
  <g class="s s2">
    <path fill="#e2192c" transform="translate(104, 54) scale(1.75)" d="M12 21s-7.5-4.6-10.2-9.3C.3 9 1.4 5.4 4.7 4.4c2-.6 4 .2 5.3 2 .5.7 1 1.6 2 1.6s1.5-.9 2-1.6c1.3-1.8 3.3-2.6 5.3-2 3.3 1 4.4 4.6 2.9 7.3C19.5 16.4 12 21 12 21z" />
  </g>

  <!-- Diamond (Bottom) -->
  <g class="s s3">
    <path fill="#e2192c" transform="translate(54, 104) scale(1.75)" d="M12 2c2.5 4 5.5 7 8 10-2.5 3-5.5 6-8 10-2.5-4-5.5-7-8-10 2.5-3 5.5-6 8-10z" />
  </g>

  <!-- Spade (Left) -->
  <g class="s s4">
    <path fill="#111111" transform="translate(4, 54) scale(1.75)" d="M12 2C9 6 4 9.5 4 14a4 4 0 0 0 7 2.6c-.3 2.2-1.2 3.7-2.6 4.9a.6.6 0 0 0 .4 1h6.4a.6.6 0 0 0 .4-1c-1.4-1.2-2.3-2.7-2.6-4.9A4 4 0 0 0 20 14c0-4.5-5-8-8-12z" />
  </g>
</svg>
